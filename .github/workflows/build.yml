name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NODEJS_MOBILE_VERSION: v18.20.4
  NDK_VERSION: 25.2.9519653

jobs:
  test:
    name: Test payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Assemble payload
        run: TARGET=test bash packaging/assemble-payload.sh
      - name: Syntax check
        run: node --check packaging/build/payload/server.js
      - name: Smoke test
        run: |
          cd packaging/build/payload
          node server.js > /tmp/km.log 2>&1 &
          PID=$!
          sleep 3
          curl -sf http://localhost:8080/api/app-info
          curl -sf -c /tmp/km.cookies -X POST http://localhost:8080/api/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}'
          curl -sf -b /tmp/km.cookies http://localhost:8080/api/capabilities
          kill "$PID" || true

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK/NDK components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download nodejs-mobile
        run: |
          curl -fsSL -o /tmp/nodejs-mobile.zip \
            "https://github.com/nodejs-mobile/nodejs-mobile/releases/download/${NODEJS_MOBILE_VERSION}/nodejs-mobile-${NODEJS_MOBILE_VERSION}-android.zip"
          rm -rf /tmp/nm && mkdir -p /tmp/nm
          unzip -q /tmp/nodejs-mobile.zip -d /tmp/nm
          LIB="$(find /tmp/nm -path '*/bin/arm64-v8a/libnode.so' | head -1)"
          NMDIR="$(cd "$(dirname "$(dirname "$LIB")")/.." && pwd)"
          echo "NMDIR=$NMDIR" >> "$GITHUB_ENV"
          echo "Detected NMDIR=$NMDIR"
          ls "$NMDIR"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Assemble payload
        run: TARGET=android bash packaging/assemble-payload.sh

      - name: Stage libnode + headers + payload
        run: |
          APP=packaging/android/app/src/main
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "$APP/jniLibs/$abi"
            cp "$NMDIR/bin/$abi/libnode.so" "$APP/jniLibs/$abi/libnode.so"
          done
          HDR="$(dirname "$(find "$NMDIR" -name node.h | head -1)")"
          echo "Headers: $HDR"
          mkdir -p "$APP/cpp/libnode/include/node"
          cp -r "$HDR/." "$APP/cpp/libnode/include/node/"
          rm -rf "$APP/assets/nodejs-project"
          mkdir -p "$APP/assets"
          cp -r packaging/build/payload "$APP/assets/nodejs-project"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: packaging/android

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        if: ${{ env.KEYSTORE_FILE != '' }}
        run: gradle assembleRelease --no-daemon
        working-directory: packaging/android

      - name: Collect APKs
        run: |
          mkdir -p out
          find packaging/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: kangmanis-apk
          path: out/*.apk
          if-no-files-found: error

  magisk:
    name: Build Magisk module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3

      - name: Install NDK + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip patchelf
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download nodejs-mobile
        run: |
          curl -fsSL -o /tmp/nodejs-mobile.zip \
            "https://github.com/nodejs-mobile/nodejs-mobile/releases/download/${NODEJS_MOBILE_VERSION}/nodejs-mobile-${NODEJS_MOBILE_VERSION}-android.zip"
          rm -rf /tmp/nm && mkdir -p /tmp/nm
          unzip -q /tmp/nodejs-mobile.zip -d /tmp/nm
          LIB="$(find /tmp/nm -path '*/bin/arm64-v8a/libnode.so' | head -1)"
          NMDIR="$(cd "$(dirname "$(dirname "$LIB")")/.." && pwd)"
          HDR="$(dirname "$(find "$NMDIR" -name node.h | head -1)")"
          echo "NMDIR=$NMDIR" >> "$GITHUB_ENV"
          echo "NODE_INCLUDE=$HDR" >> "$GITHUB_ENV"

      - name: Package Magisk modules
        run: bash packaging/magisk/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: kangmanis-magisk
          path: packaging/build/magisk/*.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ apk, magisk ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List files
        run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
