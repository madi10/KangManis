<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KangManis - Login</title>
    <script>if (localStorage.getItem('theme') === 'light') document.documentElement.className = 'light';</script>
    <script src="assets/tailwind.js"></script>
    <script src="assets/lucide.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: 'rgb(var(--c-bg) / <alpha-value>)',
                        surface: 'rgb(var(--c-surface) / <alpha-value>)',
                        raised: 'rgb(var(--c-raised) / <alpha-value>)',
                        border: 'rgb(var(--c-border) / <alpha-value>)',
                        text: 'rgb(var(--c-text) / <alpha-value>)',
                        muted: 'rgb(var(--c-muted) / <alpha-value>)',
                        faint: 'rgb(var(--c-faint) / <alpha-value>)',
                        accent: 'rgb(var(--c-accent) / <alpha-value>)',
                        ok: 'rgb(var(--c-ok) / <alpha-value>)',
                        danger: 'rgb(var(--c-danger) / <alpha-value>)',
                        warn: 'rgb(var(--c-warn) / <alpha-value>)'
                    },
                    fontFamily: {
                        sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --c-bg: 248 250 252;
            --c-surface: 255 255 255;
            --c-raised: 241 245 249;
            --c-border: 226 232 240;
            --c-text: 15 23 42;
            --c-muted: 71 85 105;
            --c-faint: 148 163 184;
            --c-accent: 79 70 229;
            --c-ok: 5 150 105;
            --c-danger: 220 38 38;
            --c-warn: 217 119 6;
        }
        .dark {
            --c-bg: 2 6 23;
            --c-surface: 15 23 42;
            --c-raised: 30 41 59;
            --c-border: 51 65 85;
            --c-text: 226 232 240;
            --c-muted: 148 163 184;
            --c-faint: 100 116 139;
            --c-accent: 99 102 241;
            --c-ok: 52 211 153;
            --c-danger: 248 113 113;
            --c-warn: 251 191 36;
        }
        html:not(.dark) { color-scheme: light; }
        html.dark { color-scheme: dark; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        .anim-in { animation: fadeUp .35s ease-out both; }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
</head>
<body class="min-h-screen bg-bg text-text font-sans antialiased flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Background decoration -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
        <div class="absolute -top-32 -right-24 w-[28rem] h-[28rem] bg-accent/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-32 -left-24 w-[28rem] h-[28rem] bg-ok/10 rounded-full blur-3xl"></div>
    </div>

    <main class="relative w-full max-w-[400px] anim-in">
        <!-- Logo -->
        <div class="text-center mb-7">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-accent to-accent/60 shadow-lg shadow-accent/20 mb-4">
                <i data-lucide="hard-drive" class="w-7 h-7 text-white"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-text">KangManis</h1>
            <p class="text-sm text-muted mt-1">Backup &amp; Storage Jaringan Lokal</p>
        </div>

        <!-- Login Card -->
        <div class="bg-surface border border-border rounded-2xl p-6 sm:p-7 shadow-xl shadow-black/5">
            <form id="loginForm" class="space-y-5" novalidate>
                <!-- Username -->
                <div>
                    <label for="username" class="block text-xs font-semibold text-muted mb-1.5">Username</label>
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-faint pointer-events-none"></i>
                        <input type="text" id="username" name="username" autocomplete="username" placeholder="Masukkan username"
                            class="w-full bg-bg border border-border rounded-xl pl-10 pr-4 py-3 text-sm text-text placeholder-faint focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-xs font-semibold text-muted mb-1.5">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-faint pointer-events-none"></i>
                        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Masukkan password"
                            class="w-full bg-bg border border-border rounded-xl pl-10 pr-11 py-3 text-sm text-text placeholder-faint focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition">
                        <button type="button" onclick="togglePw()" aria-label="Tampilkan / sembunyikan password"
                            class="absolute right-2.5 top-1/2 -translate-y-1/2 w-8 h-8 inline-flex items-center justify-center rounded-lg text-faint hover:text-muted transition-colors">
                            <i data-lucide="eye" class="w-4 h-4" id="pwIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" id="submitBtn"
                    class="w-full inline-flex items-center justify-center gap-2 bg-accent hover:bg-accent/90 text-white font-semibold py-3 rounded-xl transition-all duration-200 shadow-sm hover:shadow-md active:scale-[.98] disabled:opacity-50 disabled:cursor-not-allowed">
                    <span id="btnText">Masuk</span>
                    <i data-lucide="loader-2" class="w-4 h-4 animate-spin hidden" id="btnSpinner"></i>
                </button>

                <!-- Error -->
                <div id="errorBox" class="hidden bg-danger/10 border border-danger/20 rounded-xl px-4 py-3 text-center text-sm text-danger"></div>
            </form>

            <div class="mt-6 pt-5 border-t border-border text-center">
                <p class="text-xs text-faint">Default: <code class="text-muted bg-raised rounded px-1.5 py-0.5">admin</code> / <code class="text-muted bg-raised rounded px-1.5 py-0.5">admin123</code></p>
            </div>
        </div>

        <p class="text-center text-xs text-faint mt-6">KangManis v3.0</p>
    </main>

    <script>
        lucide.createIcons();

        function togglePw() {
            const pw = document.getElementById('password');
            const icon = document.getElementById('pwIcon');
            if (pw.type === 'password') { pw.type = 'text'; icon.setAttribute('data-lucide', 'eye-off'); }
            else { pw.type = 'password'; icon.setAttribute('data-lucide', 'eye'); }
            lucide.createIcons();
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('errorBox');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            errorBox.classList.add('hidden');
            submitBtn.disabled = true;
            btnText.textContent = '';
            btnSpinner.classList.remove('hidden');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (data.success) window.location.href = '/';
                else { errorBox.textContent = data.message || 'Login gagal'; errorBox.classList.remove('hidden'); }
            } catch {
                errorBox.textContent = 'Koneksi error, coba lagi';
                errorBox.classList.remove('hidden');
            }
            submitBtn.disabled = false;
            btnText.textContent = 'Masuk';
            btnSpinner.classList.add('hidden');
        });

        document.getElementById('username').focus();
    </script>
</body>
</html>
